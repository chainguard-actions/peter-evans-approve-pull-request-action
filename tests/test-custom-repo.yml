name: Test custom repo input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          number: "1"
          repo: "peter-evans/approve-pull-request-action"
      - name: Assert action ran (succeeded or failed gracefully with custom repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (PR #1 may not exist or token lacks access)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
